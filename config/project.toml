# Change seasons here instead of editing Python code.
[data]
historical_start = 2023
historical_end = 2025
current_season = 2026
positions = ["QB", "RB", "WR", "TE"]

# Match nflverse PPR: offensive lost fumbles, special-teams TDs, no recovery-TD bonus.
[scoring]
format = "full_ppr"
reception = 1.0
passing_yard = 0.04
passing_td = 4.0
interception = -2.0
rushing_yard = 0.1
rushing_td = 6.0
receiving_yard = 0.1
receiving_td = 6.0
fumble_lost = -2.0
two_point_conversion = 2.0
special_teams_td = 6.0

[features]
recent_games = 3
# Carry regular-season history across the offseason, but not indefinitely.
history_days = 365
active_roster_status = "ACT"

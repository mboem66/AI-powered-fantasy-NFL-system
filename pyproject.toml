[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-capstone"
version = "0.1.0"
description = "An explainable fantasy football prediction capstone"
requires-python = ">=3.11"
dependencies = ["nflreadpy>=0.1,<0.2", "polars>=1.0,<2", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
